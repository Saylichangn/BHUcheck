services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bhucheck
    ports:
      - "5432:5432"
    volumes:
      - bhuc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhucheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bhuc_pgdata:
